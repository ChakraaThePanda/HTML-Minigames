<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Archipelago Seed Picker</title>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet" />
<style>
  /* =============================================
     DESIGN TOKENS — Retro CRT coin-op cabinet
     ============================================= */
  :root {
    --bg:        #05080a;
    --phosphor:  #3dffb8;
    --amber:     #ffcf4d;
    --danger:    #ff4d6d;
    --ink:       #eafff4;

    --rank-s: var(--amber);
    --rank-a: #ff9d4d;
    --rank-b: var(--phosphor);
    --rank-c: #6fd0ff;
    --rank-d: #8fa89c;

    --font: 'VT323', monospace;
    --radius: 4px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html { background: var(--bg); }

  body {
    background:
      radial-gradient(ellipse at 18% 0%, rgba(61,255,184,.10) 0%, transparent 55%),
      radial-gradient(ellipse at 85% 100%, rgba(255,207,77,.06) 0%, transparent 55%),
      var(--bg);
    color: var(--ink);
    font-family: var(--font);
    font-size: 1.15rem;
    min-height: 100vh;
    padding: 34px 16px 60px;
    display: flex;
    justify-content: center;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }

  /* ---- CABINET FRAME ---- */
  .frame {
    position: relative;
    width: min(1000px, 100%);
    padding: 30px 30px 34px;
    border-radius: 20px;
    background:
      radial-gradient(circle at 22px 22px, #2c2f28 0 4px, transparent 5px),
      radial-gradient(circle at calc(100% - 22px) 22px, #2c2f28 0 4px, transparent 5px),
      radial-gradient(circle at 22px calc(100% - 22px), #2c2f28 0 4px, transparent 5px),
      radial-gradient(circle at calc(100% - 22px) calc(100% - 22px), #2c2f28 0 4px, transparent 5px),
      radial-gradient(ellipse at center, #0b120d 0%, #04070a 100%);
    border: 10px solid #16190f;
    box-shadow: 0 0 0 3px #000, 0 30px 70px rgba(0,0,0,.55), inset 0 0 90px rgba(0,0,0,.55);
    color: var(--ink);
  }
  .frame::before {
    content: ''; position: absolute; inset: 14px; border-radius: 12px; pointer-events: none; z-index: 2;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.55) 100%);
  }
  .frame::after {
    content: ''; position: absolute; inset: 14px; border-radius: 12px; pointer-events: none; z-index: 2;
    background: repeating-linear-gradient(to bottom, rgba(0,0,0,.22) 0 1px, transparent 2px 3px);
    mix-blend-mode: multiply;
  }
  .frame-inner { position: relative; z-index: 1; }

  /* ---- MARQUEE CHASE LIGHTS ---- */
  .marquee-lights { display: flex; justify-content: center; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
  .marquee-lights span {
    width: 6px; height: 6px; border-radius: 50%; background: var(--amber);
    box-shadow: 0 0 6px var(--amber); opacity: .2;
    animation: crt-chase 1.6s linear infinite; animation-delay: calc(var(--i) * .09s);
  }
  @keyframes crt-chase { 0%, 80%, 100% { opacity: .18; } 10% { opacity: 1; } }

  /* ---- MUTE BUTTON ---- */
  .top { position: relative; text-align: center; margin-bottom: 6px; }
  .btn-mute {
    position: absolute; top: -4px; right: 0;
    font-family: var(--font); font-size: .95rem; letter-spacing: .05em;
    padding: 6px 12px;
    border: 1.5px solid var(--phosphor); border-radius: var(--radius);
    background: transparent; color: var(--phosphor);
    cursor: pointer; text-shadow: 0 0 6px var(--phosphor);
    transition: background .15s, color .15s, box-shadow .15s;
  }
  .btn-mute:hover { background: var(--phosphor); color: #04140d; text-shadow: none; box-shadow: 0 0 16px var(--phosphor); }
  .btn-mute.muted { border-color: var(--rank-d); color: var(--rank-d); text-shadow: none; }
  .btn-mute.muted:hover { background: var(--rank-d); color: #04140d; box-shadow: none; }
  .btn-mute:active { transform: scale(.95); }

  /* ---- BRAND / LOGO ---- */
  .brand { display: flex; flex-direction: column; align-items: center; }
  .crt-logo { margin-bottom: 2px; }
  .crt-logo svg { height: clamp(40px, 7vw, 60px); width: auto; filter: drop-shadow(0 0 8px var(--phosphor)); }
  .crt-logo svg .st0 { fill: var(--phosphor) !important; }

  .brand-fallback {
    display: none;
    font-size: clamp(2.4rem, 6vw, 3.6rem);
    letter-spacing: .04em;
    color: var(--phosphor);
    text-shadow: 0 0 10px var(--phosphor), 0 0 26px rgba(61,255,184,.5);
  }

  .subtitle {
    color: var(--amber);
    opacity: .9;
    font-size: 1.05rem;
    margin-top: 2px;
    margin-bottom: 28px;
    letter-spacing: .1em;
    text-transform: uppercase;
    text-align: center;
  }

  .crt-caret { animation: crt-blink 1s steps(1) infinite; }
  @keyframes crt-blink { 50% { opacity: 0; } }

  /* ---- COUNT ROW ---- */
  .count-row {
    display: flex; align-items: center; justify-content: center;
    gap: 14px; margin-bottom: 28px; flex-wrap: wrap;
  }
  .count-row label { font-size: 1.05rem; color: var(--ink); }
  .count-input {
    width: 80px;
    background: rgba(61,255,184,.05);
    border: 1.5px solid var(--phosphor);
    border-radius: var(--radius);
    color: var(--phosphor);
    font-family: var(--font);
    font-size: 1.5rem;
    text-align: center;
    padding: 4px 8px;
    outline: none;
    text-shadow: 0 0 6px var(--phosphor);
    transition: box-shadow .2s;
  }
  .count-input:focus, .count-input:focus-visible { box-shadow: 0 0 0 3px rgba(61,255,184,.25); }
  .count-input:disabled { opacity: .4; cursor: not-allowed; }
  .count-input::-webkit-outer-spin-button, .count-input::-webkit-inner-spin-button { -webkit-appearance: none; }

  /* ---- PANELS ---- */
  .panels {
    display: grid; grid-template-columns: 1fr 1fr; gap: 20px;
    margin-bottom: 26px;
    transition: opacity .3s ease, filter .3s ease;
  }
  .panels.busy { opacity: .5; filter: saturate(.5); }

  @media (max-width: 640px) {
    .panels { grid-template-columns: 1fr; }
  }

  .panel {
    background: rgba(0,0,0,.35);
    border: 1.5px solid var(--phosphor);
    border-radius: var(--radius);
    overflow: hidden;
  }
  .panel-possible { border-color: var(--amber); }

  .panel-header {
    padding: 10px 14px;
    border-bottom: 1.5px solid inherit;
    border-bottom-color: rgba(255,255,255,.15);
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  }

  .panel-title-wrap { display: flex; flex-direction: column; line-height: 1.2; }
  .panel-title {
    font-size: 1.25rem;
    letter-spacing: .04em;
    color: var(--phosphor);
    text-shadow: 0 0 6px var(--phosphor);
  }
  .panel-title::before { content: '> '; }
  .panel-possible .panel-title { color: var(--amber); text-shadow: 0 0 6px var(--amber); }
  .panel-flavor {
    font-size: .82rem;
    color: var(--rank-d);
    letter-spacing: .08em;
    text-transform: uppercase;
  }

  .panel-count {
    font-size: .9rem;
    color: var(--ink);
    opacity: .8;
    background: rgba(255,255,255,.06);
    border-radius: 2px;
    padding: 2px 8px;
    margin-left: auto;
    white-space: nowrap;
  }

  .btn-select-all {
    font-family: var(--font);
    font-size: .9rem;
    letter-spacing: .04em;
    padding: 3px 10px;
    border-radius: 2px;
    border: 1.5px solid var(--amber);
    background: transparent;
    color: var(--amber);
    cursor: pointer;
    transition: background .15s, color .15s;
    white-space: nowrap;
  }
  .btn-select-all::before { content: '['; }
  .btn-select-all::after { content: ']'; }
  .btn-select-all:hover:not(:disabled) { background: var(--amber); color: #241a02; }
  .btn-select-all:active:not(:disabled) { transform: scale(.96); }
  .btn-select-all.all-selected { opacity: .65; }
  .btn-select-all:disabled { opacity: .35; cursor: not-allowed; }
  .btn-select-all:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }

  .panel-body {
    padding: 6px;
    max-height: 420px;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--phosphor) transparent;
  }
  .panel-body::-webkit-scrollbar { width: 7px; }
  .panel-body::-webkit-scrollbar-thumb { background: var(--phosphor); border-radius: 10px; }

  /* ---- GAME ITEM (terminal line) ---- */
  .game-item {
    display: flex; align-items: center; gap: 8px;
    padding: 8px;
    border-radius: 2px;
    cursor: pointer;
    user-select: none;
    border: 1px solid transparent;
    transition: background .12s, border-color .12s;
  }
  .game-item:hover:not(.disabled) { border-color: rgba(61,255,184,.25); background: rgba(61,255,184,.06); }
  .panel-possible .game-item:hover:not(.disabled) { border-color: rgba(255,207,77,.25); background: rgba(255,207,77,.06); }
  .game-item:active:not(.disabled) { transform: scale(.99); }
  .game-item:focus-visible { outline: 2px solid var(--phosphor); outline-offset: 1px; }
  .game-item.selected { background: rgba(61,255,184,.1); border-color: var(--phosphor); }
  .panel-possible .game-item.selected { background: rgba(255,207,77,.1); border-color: var(--amber); }

  .game-item.disabled { opacity: .3; cursor: not-allowed; }

  .crt-cursor { width: 1em; flex-shrink: 0; color: var(--phosphor); }
  .crt-cursor::before { content: ''; }
  .game-item.selected .crt-cursor::before { content: '>'; }
  .panel-possible .game-item.selected .crt-cursor { color: var(--amber); }

  .crt-rank { width: 2.6em; flex-shrink: 0; font-weight: bold; }
  .crt-rank[data-rank="S"] { color: var(--rank-s); }
  .crt-rank[data-rank="A"] { color: var(--rank-a); }
  .crt-rank[data-rank="B"] { color: var(--rank-b); }
  .crt-rank[data-rank="C"] { color: var(--rank-c); }
  .crt-rank[data-rank="D"] { color: var(--rank-d); }
  .crt-rank.shuffle { animation: crt-shimmer .22s linear infinite; }
  @keyframes crt-shimmer { 0%, 100% { opacity: .5; } 50% { opacity: 1; } }

  .crt-name { flex: 1; text-transform: uppercase; letter-spacing: .01em; }

  /* ---- ROLL BUTTON ---- */
  .btn-wrap { display: flex; justify-content: center; margin-bottom: 34px; }
  .btn-randomize {
    font-family: var(--font);
    font-size: 1.4rem;
    letter-spacing: .06em;
    padding: 12px 34px;
    border: 1.5px solid var(--phosphor);
    border-radius: var(--radius);
    background: transparent;
    color: var(--phosphor);
    text-shadow: 0 0 6px var(--phosphor);
    cursor: pointer;
    transition: background .15s, color .15s, box-shadow .15s;
  }
  .btn-randomize:hover:not(:disabled) { background: var(--phosphor); color: #04140d; text-shadow: none; box-shadow: 0 0 22px var(--phosphor); }
  .btn-randomize:active:not(:disabled) { transform: scale(.97); }
  .btn-randomize:focus-visible { outline: 2px solid var(--amber); outline-offset: 3px; }
  .btn-randomize:disabled { opacity: .35; cursor: not-allowed; }
  .btn-randomize.busy { cursor: wait; }

  /* ---- STATUS LINE ---- */
  .status-line {
    text-align: center;
    font-size: 1rem;
    color: var(--rank-d);
    margin-bottom: 14px;
    min-height: 1.3em;
  }
  .status-line::before { content: '> '; }
  .status-line span { color: var(--phosphor); font-weight: bold; }

  /* ---- RESULTS ---- */
  .results {
    max-width: 640px;
    margin: 0 auto;
    opacity: 0;
    transform: translateY(16px);
    transition: opacity .4s, transform .4s;
    pointer-events: none;
  }
  .results.visible { opacity: 1; transform: none; pointer-events: auto; }

  .results-header {
    display: flex; align-items: center; justify-content: center; gap: 14px;
    margin-bottom: 14px;
  }
  .results-title {
    font-size: 1.7rem;
    letter-spacing: .05em;
    color: var(--phosphor);
    text-shadow: 0 0 8px var(--phosphor);
  }
  .results-title::before { content: '> '; }

  .btn-export {
    font-family: var(--font);
    font-size: .95rem;
    letter-spacing: .03em;
    padding: 4px 12px;
    border-radius: 2px;
    border: 1.5px solid var(--amber);
    background: transparent;
    color: var(--amber);
    cursor: pointer;
    transition: background .15s, color .15s;
    white-space: nowrap;
  }
  .btn-export:hover { background: var(--amber); color: #241a02; }
  .btn-export.copied { background: var(--amber); color: #241a02; }
  .btn-export:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }

  /* ---- SPINNER / BOOT STAGE ---- */
  .spinner-stage { text-align: center; padding: 6px 0 18px; }
  .spinner-stage[hidden] { display: none; }
  .spin-caption { color: var(--amber); letter-spacing: .06em; font-size: 1.15rem; text-shadow: 0 0 6px var(--amber); }

  /* ---- REVEAL LOG ---- */
  .result-list { display: flex; flex-direction: column; gap: 4px; }
  .crt-line {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 4px 10px;
    border-left: 3px solid var(--phosphor);
    background: rgba(61,255,184,.04);
  }
  .crt-line.result-rolled { border-left-color: var(--amber); background: rgba(255,207,77,.04); }
  .crt-line.landed { animation: crt-land .3s ease both; }
  @keyframes crt-land {
    0% { opacity: 0; transform: translateX(-4px); }
    100% { opacity: 1; transform: none; }
  }
  .crt-slot { color: var(--ink); opacity: .7; }
  .crt-tag {
    margin-left: auto;
    font-size: .82rem;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--rank-d);
  }
  .crt-line.result-guaranteed .crt-tag { color: var(--phosphor); }
  .crt-line.result-rolled.landed .crt-tag { color: var(--amber); }

  .results.reveal-glow .result-list { animation: crt-reveal-flash .8s ease; }
  @keyframes crt-reveal-flash {
    0% { box-shadow: 0 0 0 rgba(61,255,184,0); }
    35% { box-shadow: 0 0 50px 4px rgba(61,255,184,.22); }
    100% { box-shadow: 0 0 0 rgba(61,255,184,0); }
  }

  .crt-done {
    margin-top: 6px;
    color: var(--amber);
    text-shadow: 0 0 8px var(--amber);
    letter-spacing: .05em;
    animation: crt-blink 1s steps(1) infinite;
  }

  @media (max-width: 640px) {
    .frame { padding: 22px 16px 24px; }
    .marquee-lights span:nth-child(even) { display: none; }
    .results-title { font-size: 1.4rem; }
    .btn-randomize { font-size: 1.15rem; padding: 10px 24px; }
    .btn-mute { position: static; display: inline-block; margin-bottom: 10px; }
  }
</style>
</head>

    <div class="top">

const RANK_WEIGHTS = { S: 5, A: 4, B: 3, C: 2, D: 1 };

/* =====================================================
   SOUND — self-contained WebAudio synth, terminal/arcade
   square-wave blips, no assets
   ===================================================== */
const Sound = (function () {
  let ctx = null;
  let muted = false;

  function ensureCtx() {
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      ctx = new AC();
    }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }

  function tone(freq, start, duration, type, peak) {
    if (muted) return;
    const c = ensureCtx();
    const t0 = c.currentTime + start;
    const osc = c.createOscillator();
    const gain = c.createGain();
    osc.type = type || 'square';
    osc.frequency.setValueAtTime(freq, t0);
    gain.gain.setValueAtTime(0, t0);
    gain.gain.linearRampToValueAtTime(peak || 0.05, t0 + 0.008);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
    osc.connect(gain);
    gain.connect(c.destination);
    osc.start(t0);
    osc.stop(t0 + duration + 0.02);
  }

  return {
    init() { ensureCtx(); },
    setMuted(v) {
      muted = v;
      try { localStorage.setItem('apgp_muted', v ? '1' : '0'); } catch (e) {}
    },
    isMuted() { return muted; },

    hover() { tone(520, 0, 0.03, 'square', 0.03); },
    select(turningOn) {
      turningOn ? tone(760, 0, 0.04, 'square', 0.045)
                : tone(400, 0, 0.04, 'square', 0.035);
    },
    error() { tone(140, 0, 0.12, 'square', 0.06); tone(90, 0.05, 0.16, 'square', 0.05); },
    selectAllSweep(turningOn) {
      const notes = turningOn ? [520, 660, 840] : [840, 660, 520];
      notes.forEach((f, i) => tone(f, i * 0.05, 0.08, 'square', 0.045));
    },
    copyConfirm() { tone(700, 0, 0.05, 'square', 0.05); tone(1050, 0.06, 0.08, 'square', 0.045); },
    spinTick(i) { tone(300 + (i % 12) * 40, 0, 0.03, 'square', 0.03); },
    shuffleTick(i) { tone(300 + ((i || 0) % 10) * 30 + Math.random() * 40, 0, 0.022, 'square', 0.022); },
    lockThunk() { tone(200, 0, 0.08, 'square', 0.06); tone(90, 0.02, 0.16, 'sine', 0.07); },
    reveal(i) { tone(760 + i * 40, 0, 0.06, 'square', 0.05); tone(1140 + i * 40, 0.04, 0.08, 'square', 0.03); },
    fanfare() { [440, 660, 880, 1108].forEach((f, i) => tone(f, i * 0.09, 0.14, 'square', 0.05)); },
  };
})();

let mutedInit = false;
try { mutedInit = localStorage.getItem('apgp_muted') === '1'; } catch (e) {}
Sound.setMuted(mutedInit);

const btnMute = document.getElementById('btnMute');
btnMute.textContent = mutedInit ? '[ SND:OFF ]' : '[ SND:ON ]';
btnMute.classList.toggle('muted', mutedInit);
btnMute.addEventListener('click', () => {
  const next = !Sound.isMuted();
  Sound.setMuted(next);
  btnMute.textContent = next ? '[ SND:OFF ]' : '[ SND:ON ]';
  btnMute.classList.toggle('muted', next);
  if (!next) Sound.select(true);
});

/* =====================================================
   APP STATE
   ===================================================== */
const selectedGuaranteed = new Set();
const selectedPossible   = new Set();

const sortedGames = [...GAMES].sort((a, b) => a.name.localeCompare(b.name));

function sleep(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }

/* =====================================================
   RENDER HELPERS
   ===================================================== */
function buildItem(game, onClick) {
  const div = document.createElement('div');
  div.className = 'game-item';
  div.dataset.name = game.name;
  div.tabIndex = 0;
  div.setAttribute('role', 'checkbox');
  div.setAttribute('aria-checked', 'false');
  div.innerHTML = `
    <span class="crt-cursor"></span>
    <span class="crt-rank" data-rank="${game.rank}">[${game.rank}]</span>
    <span class="crt-name">${game.name}</span>
  `;
  div.addEventListener('click', () => onClick(game, div));
  div.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      onClick(game, div);
    }
  });
  div.addEventListener('mouseenter', () => {
    if (!div.classList.contains('disabled')) Sound.hover();
  });
  return div;
}

function renderLists() {
  const gList = document.getElementById('listGuaranteed');
  const pList = document.getElementById('listPossible');
  gList.innerHTML = '';
  pList.innerHTML = '';

  for (const game of sortedGames) {
    // Guaranteed panel
    const gItem = buildItem(game, (g, el) => {
      if (el.classList.contains('disabled')) return;
      if (selectedGuaranteed.has(g.name)) {
        selectedGuaranteed.delete(g.name);
        Sound.select(false);
      } else {
        selectedGuaranteed.add(g.name);
        selectedPossible.delete(g.name); // uncheck from possible if it was selected there
        Sound.select(true);
      }
      updateUI();
    });
    gList.appendChild(gItem);

    // Possible panel
    const pItem = buildItem(game, (g, el) => {
      if (el.classList.contains('disabled')) { Sound.error(); return; }
      if (selectedPossible.has(g.name)) {
        selectedPossible.delete(g.name);
        Sound.select(false);
      } else {
        selectedPossible.add(g.name);
        Sound.select(true);
      }
      updateUI();
    });
    pList.appendChild(pItem);
  }
}

function updateUI() {
  const want = parseInt(document.getElementById('gameCount').value) || 0;

  // Sync item states
  document.querySelectorAll('#listGuaranteed .game-item').forEach(el => {
    const name = el.dataset.name;
    const isSelected = selectedGuaranteed.has(name);
    el.classList.toggle('selected', isSelected);
    el.classList.remove('disabled');
    el.setAttribute('aria-checked', isSelected ? 'true' : 'false');
    el.removeAttribute('aria-disabled');
  });

  document.querySelectorAll('#listPossible .game-item').forEach(el => {
    const name = el.dataset.name;
    const isGuaranteed = selectedGuaranteed.has(name);
    const isSelected = selectedPossible.has(name);
    el.classList.toggle('selected', isSelected);
    el.classList.toggle('disabled', isGuaranteed);
    el.setAttribute('aria-checked', isSelected ? 'true' : 'false');
    if (isGuaranteed) el.setAttribute('aria-disabled', 'true');
    else el.removeAttribute('aria-disabled');
  });

  // Select All button label
  const availableForPossible = sortedGames.filter(g => !selectedGuaranteed.has(g.name));
  const allPossibleSelected = availableForPossible.length > 0 && availableForPossible.every(g => selectedPossible.has(g.name));
  const btnSelectAll = document.getElementById('btnSelectAll');
  btnSelectAll.textContent = allPossibleSelected ? 'Deselect All' : 'Select All';
  btnSelectAll.classList.toggle('all-selected', allPossibleSelected);

  // Counts
  document.getElementById('countGuaranteed').textContent =
    selectedGuaranteed.size + ' selected';
  document.getElementById('countPossible').textContent =
    selectedPossible.size + ' selected';

  // Button state
  const gCount = selectedGuaranteed.size;
  const pCount = selectedPossible.size;
  const neededFromPool = want - gCount; // how many we'll pick from "possible"
  const canRandomize = want > 0 && neededFromPool >= 0 && pCount >= neededFromPool && gCount <= want;

  document.getElementById('btnRandomize').disabled = !canRandomize;

  // Status hint
  const line = document.getElementById('statusLine');
  if (want <= 0) {
    line.innerHTML = 'Set how many games you want above.';
  } else if (gCount > want) {
    line.innerHTML = `You have <span>${gCount}</span> locked in but only want <span>${want}</span>.`;
  } else if (!canRandomize) {
    const need = Math.max(0, neededFromPool - pCount);
    line.innerHTML = `Select at least <span>${need}</span> more draft pool game${need !== 1 ? 's' : ''} to roll from.`;
  } else {
    line.innerHTML = `<span>${gCount}</span> locked in + rolling <span>${neededFromPool}</span> from <span>${pCount}</span> in the draft pool.`;
  }
}

/* =====================================================
   SELECT ALL (Possible)
   ===================================================== */
document.getElementById('btnSelectAll').addEventListener('click', () => {
  const availableGames = sortedGames.filter(g => !selectedGuaranteed.has(g.name));
  if (availableGames.length === 0) { Sound.error(); return; }
  const allSelected = availableGames.every(g => selectedPossible.has(g.name));

  if (allSelected) {
    // Deselect all possible
    availableGames.forEach(g => selectedPossible.delete(g.name));
    Sound.selectAllSweep(false);
  } else {
    // Select all non-guaranteed games
    availableGames.forEach(g => selectedPossible.add(g.name));
    Sound.selectAllSweep(true);
  }
  updateUI();
});


function weightedSample(pool, n) {
  const chosen = [];
  const available = pool.map(name => {
    const game = GAMES.find(g => g.name === name);
    return { name, weight: RANK_WEIGHTS[game.rank] ?? 1 };
  });

  for (let i = 0; i < n; i++) {
    const total = available.reduce((s, g) => s + g.weight, 0);
    let r = Math.random() * total;
    let idx = 0;
    for (; idx < available.length; idx++) {
      r -= available[idx].weight;
      if (r <= 0) break;
    }
    chosen.push(available[idx].name);
    available.splice(idx, 1);
  }
  return chosen;
}

/* =====================================================

const spinnerStage   = document.getElementById('spinnerStage');

function makeResultLine(index, type) {
  const el = document.createElement('div');

function landResultLine(el, game, type) {
  el.classList.remove('shuffling');
  el.classList.add('landed');
  const rankEl = el.querySelector('.crt-rank');
  rankEl.classList.remove('shuffle');
  rankEl.dataset.rank = game.rank;
  rankEl.textContent = `[${game.rank}]`;
  el.querySelector('.crt-name').textContent = game.name;
  el.querySelector('.crt-tag').textContent = type === 'guaranteed' ? 'LOCKED' : 'DRAFTED';
}

async function revealGuaranteed(index, name) {
  const game = GAMES.find(g => g.name === name);
  const el = makeResultLine(index, 'guaranteed');
  resultList.appendChild(el);
  landResultLine(el, game, 'guaranteed');
  Sound.lockThunk();
  await sleep(130);
}

async function revealRolled(index, name, rollOrder) {
  const game = GAMES.find(g => g.name === name);
  const el = makeResultLine(index, 'rolled');
  el.classList.add('shuffling');
  resultList.appendChild(el);

  const nameEl = el.querySelector('.crt-name');
  const rankEl = el.querySelector('.crt-rank');
  let tickCount = 0;
  const shuffleTimer = setInterval(() => {
    const decoy = GAMES[Math.floor(Math.random() * GAMES.length)];
    nameEl.textContent = decoy.name;
    rankEl.dataset.rank = decoy.rank;
    rankEl.textContent = `[${decoy.rank}]`;
    Sound.shuffleTick(tickCount++);
  }, 65);

  await sleep(420 + rollOrder * 25);
  clearInterval(shuffleTimer);
  landResultLine(el, game, 'rolled');
  Sound.reveal(rollOrder);
  await sleep(160);
}

async function handleRandomize() {
  if (btnRandomize.disabled || btnRandomize.classList.contains('busy')) return;
  Sound.init();

  const want = parseInt(gameCountInput.value) || 0;
  const guaranteedNames = [...selectedGuaranteed].sort((a, b) => a.localeCompare(b));
  const neededFromPool = want - guaranteedNames.length;
  const rolledNames = weightedSample([...selectedPossible], neededFromPool);

  setUIBusy(true);
  resultList.innerHTML = '';
  resultsEl.classList.remove('reveal-glow');
  resultsEl.classList.add('visible');
  resultsEl.scrollIntoView({ behavior: 'smooth', block: 'start' });

  spinCaption.innerHTML = SPIN_CAPTIONS[Math.floor(Math.random() * SPIN_CAPTIONS.length)] + '<span class="crt-caret">_</span>';
  spinnerStage.hidden = false;
  let spinTickCount = 0;
  const spinTickTimer = setInterval(() => Sound.spinTick(spinTickCount++), 90);
  await sleep(1250);
  clearInterval(spinTickTimer);
  spinCaption.innerHTML = '&gt; LOCKING IN PICKS...<span class="crt-caret">_</span>';
  await sleep(400);
  spinnerStage.hidden = true;

  // Guaranteed slots land solidly — they were never in doubt.
  for (let i = 0; i < guaranteedNames.length; i++) {
    await revealGuaranteed(i + 1, guaranteedNames[i]);
  }

  // Rolled slots get the suspense treatment, one at a time.
  for (let i = 0; i < rolledNames.length; i++) {
    await revealRolled(guaranteedNames.length + i + 1, rolledNames[i], i);
  }

  const doneLine = document.createElement('div');
  doneLine.className = 'crt-line crt-done';
  doneLine.innerHTML = '&gt; SEED LOCKED<span class="crt-caret">_</span>';
  resultList.appendChild(doneLine);

  Sound.fanfare();
  resultsEl.classList.add('reveal-glow');
  setTimeout(() => resultsEl.classList.remove('reveal-glow'), 1600);

  // Store for export
  const allResults = [
    ...guaranteedNames.map(n => ({ name: n, type: 'guaranteed' })),
    ...rolledNames.map(n => ({ name: n, type: 'rolled' })),
  ];
  resultsEl.dataset.export = allResults
    .map((item, i) => {
      const game = GAMES.find(g => g.name === item.name);
      return `${i + 1}. ${item.name} (${game.rank})`;
    })
    .join('\n');

  setUIBusy(false);
}

btnRandomize.addEventListener('click', handleRandomize);

/* =====================================================
   EXPORT
   ===================================================== */
document.getElementById('btnExport').addEventListener('click', () => {
  const text = document.getElementById('results').dataset.export || '';
  if (!text) return;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.getElementById('btnExport');
    btn.innerHTML = '&gt; COPIED!';
    btn.classList.add('copied');
    Sound.copyConfirm();
    setTimeout(() => {
      btn.innerHTML = '&gt; COPY_GAMES.TXT';
      btn.classList.remove('copied');
    }, 2000);
  }).catch(() => {
    Sound.error();
  });
});

/* =====================================================
   MARQUEE CHASE LIGHTS
   ===================================================== */
const marquee = document.getElementById('marqueeLights');
for (let i = 0; i < 16; i++) {
  const s = document.createElement('span');
  s.style.setProperty('--i', i);
  marquee.appendChild(s);
}

/* =====================================================
   INIT
   ===================================================== */
document.getElementById('gameCount').addEventListener('input', updateUI);
renderLists();
updateUI();
</script>
